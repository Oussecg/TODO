<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Web Page</title>
        <script
            src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"
        ></script>
        <link rel="stylesheet" href="styles/todo/style.css" />
    </head>
    <body>
        <a class="switch-theme"
            ><img src="images/switch-theme/toggle_off.svg" class="switch-image"
        /></a>

        <header>
            <h1 class="page-title">TODO Project</h1>
        </header>

        <main>
            <article class="input-container">
                <label>
                    <input
                        type="text"
                        class="todo-input"
                        placeholder="Make a task here"
                    />
                </label>

                <label>
                    <input type="date" class="date-input" />
                </label>
                <button class="add-button">Add</button>
            </article>

            <article id="todo-list"></article>
        </main>
        <div id="result"></div>
        <footer>
            <a href="status.html" class="externel-page">Status</a>
        </footer>
    </body>
    <script src="scripts/todo/script.js"></script>
</html>
